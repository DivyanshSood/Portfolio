<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pinnacle World School — CBSE school website">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind building -->
  <circle cx="256" cy="270" r="130" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Flame (torch of learning) -->
  <g transform="translate(256 168)">
    <path d="M 0 -52 C 22 -24 30 -6 18 14 C 12 24 -12 24 -18 14 C -30 -6 -20 -24 0 -52 Z" fill="#ff1f1f" fill-opacity="0.9"/>
    <path d="M 0 -20 C 10 -6 12 4 6 12 C 2 16 -2 16 -6 12 C -12 4 -8 -6 0 -20 Z" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="-10" y="20" width="20" height="26" rx="3" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  <!-- Open book -->
  <g transform="translate(256 300)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round">
    <path d="M 0 -30 C -40 -52 -90 -50 -128 -36 L -128 72 C -90 58 -40 58 0 80 Z" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M 0 -30 C 40 -52 90 -50 128 -36 L 128 72 C 90 58 40 58 0 80 Z" fill="#ffffff" fill-opacity="0.12"/>
    <g stroke-opacity="0.35" fill="none">
      <path d="M -104 -14 C -76 -24 -44 -22 -20 -10"/><path d="M -104 10 C -76 0 -44 2 -20 14"/><path d="M -104 34 C -76 24 -44 26 -20 38"/>
      <path d="M 104 -14 C 76 -24 44 -22 20 -10"/><path d="M 104 10 C 76 0 44 2 20 14"/><path d="M 104 34 C 76 24 44 26 20 38"/>
    </g>
  </g>
</svg>
