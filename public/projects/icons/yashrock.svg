<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Yash Rock Hotel — hillside hotel website">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind building -->
  <circle cx="256" cy="270" r="130" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Setting sun behind hills -->
  <circle cx="256" cy="232" r="46" fill="#ff1f1f" fill-opacity="0.85"/>
  <path d="M 96 262 C 160 200 210 230 256 250 C 310 222 360 206 416 262 L 416 280 L 96 280 Z" fill="#ffffff" fill-opacity="0.45"/>
  <!-- Pool -->
  <g transform="translate(256 336)">
    <rect x="-140" y="-40" width="280" height="96" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
      <path d="M -110 -8 q 18 -12 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" stroke-opacity="0.85"/>
      <path d="M -110 20 q 18 -12 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0" stroke-opacity="0.5"/>
    </g>
    <!-- Pool ladder -->
    <g stroke="#ff1f1f" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M 96 -64 L 96 -30"/><path d="M 116 -64 L 116 -30"/><path d="M 96 -52 L 116 -52"/></g>
  </g>
</svg>
