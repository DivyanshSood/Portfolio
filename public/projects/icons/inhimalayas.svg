<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="InHimalayas — Himalayan travel booking platform">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26262a"/>
      <stop offset="50%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="bevelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="topCatch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orangeMat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6a3c"/>
      <stop offset="50%" stop-color="#ff4612"/>
      <stop offset="100%" stop-color="#b82800"/>
    </linearGradient>
    <linearGradient id="silverMat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f6"/>
      <stop offset="50%" stop-color="#9d9da2"/>
      <stop offset="100%" stop-color="#5e5e63"/>
    </linearGradient>
    <linearGradient id="mountainLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#454549"/>
      <stop offset="100%" stop-color="#1c1c20"/>
    </linearGradient>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mountainShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid dark background -->
  <rect width="512" height="512" fill="#0b0b0c"/>

  <!-- Card -->
  <g filter="url(#dropShadow)">
    <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#cardSurface)"/>
  </g>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bevelTop)"/>
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bevelBottom)"/>
  <rect x="80" y="48" width="352" height="1.5" rx="0.75" fill="url(#topCatch)"/>
  <rect x="48.5" y="48.5" width="415" height="415" rx="95.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Stars -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="128" cy="120" r="1.4"/>
    <circle cx="384" cy="140" r="1.6"/>
    <circle cx="412" cy="100" r="1.2" fill-opacity="0.6"/>
    <circle cx="108" cy="180" r="1" fill-opacity="0.5"/>
  </g>

  <!-- Back peak (tallest) -->
  <g filter="url(#mountainShadow)">
    <path d="M 256 138 L 188 280 L 324 280 Z" fill="url(#mountainLight)" stroke="#000000" stroke-opacity="0.6" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Side shadow (right side darker for depth) -->
    <path d="M 256 138 L 324 280 L 256 280 Z" fill="#000000" fill-opacity="0.25"/>
    <!-- Snow cap -->
    <path d="M 256 138 L 232 188 L 244 196 L 252 184 L 260 200 L 268 192 L 280 204 Z" fill="url(#silverMat)"/>
  </g>

  <!-- Left peak (mid) -->
  <g filter="url(#mountainShadow)">
    <path d="M 168 220 L 108 320 L 228 320 Z" fill="url(#mountainLight)" stroke="#000000" stroke-opacity="0.6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 168 220 L 228 320 L 168 320 Z" fill="#000000" fill-opacity="0.25"/>
    <path d="M 168 220 L 148 256 L 158 264 L 166 254 L 174 268 L 182 260 L 192 270 Z" fill="url(#silverMat)"/>
  </g>

  <!-- Right peak (mid) -->
  <g filter="url(#mountainShadow)">
    <path d="M 348 230 L 290 322 L 406 322 Z" fill="url(#mountainLight)" stroke="#000000" stroke-opacity="0.6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 348 230 L 406 322 L 348 322 Z" fill="#000000" fill-opacity="0.25"/>
    <path d="M 348 230 L 330 262 L 340 270 L 348 260 L 358 274 L 366 266 L 376 276 Z" fill="url(#silverMat)"/>
  </g>

  <!-- Orange peak marker -->
  <g filter="url(#mountainShadow)">
    <circle cx="256" cy="138" r="6" fill="url(#orangeMat)" stroke="#7a1d04" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="254" cy="135" r="2" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- Front rolling hill -->
  <g filter="url(#mountainShadow)">
    <path d="M 60 360 Q 130 332 200 352 Q 280 374 360 348 Q 420 332 452 360 L 452 420 L 60 420 Z" fill="url(#mountainLight)"/>
  </g>
</svg>