<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dharamshala Tours — WhatsApp-first travel booking">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#ff1f1f"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind bubble -->
  <circle cx="256" cy="260" r="170" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Phone outline (centered) -->
  <g transform="translate(256 256)">
    <rect x="-78" y="-128" width="156" height="256" rx="24" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.2"/>
    <!-- Screen -->
    <rect x="-66" y="-110" width="132" height="220" rx="14" fill="#0b0b0c" fill-opacity="0.55"/>
    <!-- Notch / speaker -->
    <rect x="-16" y="-122" width="32" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
    <!-- Home indicator -->
    <rect x="-20" y="118" width="40" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- Mountain scene inside screen -->
  <g transform="translate(190 192)">
    <!-- Sky tint -->
    <rect x="0" y="0" width="132" height="80" rx="6" fill="#ff1f1f" fill-opacity="0.18"/>
    <!-- Back peak -->
    <polygon points="20,80 70,12 110,80" fill="#ffffff" fill-opacity="0.75"/>
    <!-- Snow cap -->
    <polygon points="70,12 56,38 64,42 70,32 76,44 82,38 88,46" fill="#ffffff"/>
    <!-- Front peak -->
    <polygon points="40,80 86,28 120,80" fill="#ffffff" fill-opacity="0.55"/>
    <!-- Snow cap front -->
    <polygon points="86,28 76,48 82,52 86,44 90,54 96,48" fill="#ffffff"/>
    <!-- Foreground -->
    <rect x="0" y="74" width="132" height="6" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- Chat bubble (overlapping the phone, lower right) -->
  <g transform="translate(316 320)">
    <path d="M -56 -36 L 56 -36 Q 70 -36 70 -22 L 70 16 Q 70 30 56 30 L 8 30 L -4 46 L -10 30 L -56 30 Q -70 30 -70 16 L -70 -22 Q -70 -36 -56 -36 Z"
          fill="url(#bubbleGrad)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Three dots -->
    <circle cx="-30" cy="-3" r="4.5" fill="#ffffff"/>
    <circle cx="0" cy="-3" r="4.5" fill="#ffffff"/>
    <circle cx="30" cy="-3" r="4.5" fill="#ffffff"/>
  </g>

  <!-- WhatsApp-style arc indicator (small) -->
  <g transform="translate(192 320)" opacity="0.85">
    <path d="M 0 0 Q 12 -12 24 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M -6 8 Q 12 -8 30 8" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>