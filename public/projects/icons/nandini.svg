<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nandini Travels — Kangra taxi operator">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#ff4612"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4612" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff4612" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff4612" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind car -->
  <ellipse cx="256" cy="296" rx="180" ry="100" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Location pin (above car) -->
  <g transform="translate(348 188)">
    <!-- Pin body -->
    <path d="M 0 -56 C -28 -56 -44 -38 -44 -18 C -44 6 0 44 0 44 C 0 44 44 6 44 -18 C 44 -38 28 -56 0 -56 Z"
          fill="url(#pinGrad)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Pin inner highlight -->
    <path d="M -10 -50 C -20 -50 -28 -40 -28 -30" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <!-- Pin dot -->
    <circle cx="0" cy="-22" r="9" fill="#ffffff"/>
    <!-- Drop shadow under pin -->
    <ellipse cx="0" cy="56" rx="14" ry="3" fill="#000000" fill-opacity="0.35"/>
  </g>

  <!-- Map route line (subtle, behind car) -->
  <path d="M 92 296 Q 160 270 220 296 T 348 296" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- Car (side view) -->
  <g transform="translate(120 252)">
    <!-- Roof + cabin -->
    <path d="M 28 36 L 64 0 L 144 0 L 174 36 Z" fill="url(#carBody)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Body -->
    <path d="M 0 36 L 28 36 L 64 0 L 144 0 L 174 36 L 200 36 L 200 76 L 0 76 Z" fill="url(#carBody)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linejoin="round"/>
    <!-- Windows -->
    <path d="M 36 32 L 64 8 L 96 8 L 96 32 Z" fill="#0b0b0c" fill-opacity="0.45"/>
    <path d="M 104 8 L 140 8 L 168 32 L 104 32 Z" fill="#0b0b0c" fill-opacity="0.45"/>
    <!-- Door line -->
    <line x1="100" y1="32" x2="100" y2="76" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.4"/>
    <!-- Door handle -->
    <line x1="78" y1="56" x2="92" y2="56" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="108" y1="56" x2="124" y2="56" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Headlight (red accent) -->
    <rect x="194" y="46" width="8" height="6" rx="1" fill="#ff4612"/>
    <!-- Tail light -->
    <rect x="-2" y="46" width="8" height="6" rx="1" fill="#ffffff" fill-opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="44" cy="80" r="20" fill="#0b0b0c" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="44" cy="80" r="9" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="44" cy="80" r="3" fill="#0b0b0c"/>
    <circle cx="156" cy="80" r="20" fill="#0b0b0c" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="156" cy="80" r="9" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="156" cy="80" r="3" fill="#0b0b0c"/>
  </g>

  <!-- Ground line -->
  <line x1="92" y1="356" x2="420" y2="356" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>
</svg>