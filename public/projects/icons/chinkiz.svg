<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ChinkiZ Knitting Knife — D2C creator knitting tools">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="needleShaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="yarnGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind yarn ball -->
  <circle cx="256" cy="256" r="140" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Needle 1 (top-left to bottom-right) -->
  <g transform="rotate(-32 256 256)">
    <rect x="252" y="120" width="8" height="240" rx="3" fill="url(#needleShaft)"/>
    <!-- Pointed tip -->
    <polygon points="252,120 260,120 256,108" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Cap end -->
    <rect x="248" y="356" width="16" height="22" rx="4" fill="#ff1f1f"/>
  </g>

  <!-- Needle 2 (top-right to bottom-left) -->
  <g transform="rotate(32 256 256)">
    <rect x="252" y="120" width="8" height="240" rx="3" fill="url(#needleShaft)"/>
    <polygon points="252,120 260,120 256,108" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="248" y="356" width="16" height="22" rx="4" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- Yarn ball at center -->
  <circle cx="256" cy="256" r="56" fill="url(#yarnGrad)"/>
  <!-- Yarn texture rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
    <path d="M 210 248 Q 240 220 280 240 T 304 268"/>
    <path d="M 210 264 Q 244 280 282 270 T 304 280"/>
    <path d="M 220 232 Q 252 256 286 248"/>
    <path d="M 218 280 Q 252 252 290 280"/>
    <path d="M 230 296 Q 256 280 280 296"/>
  </g>
  <!-- Yarn inner shadow -->
  <circle cx="256" cy="256" r="56" fill="none" stroke="#0b0b0c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Trailing yarn thread (red accent) -->
  <path d="M 296 290 Q 340 320 372 296 Q 396 280 410 308" fill="none" stroke="#ff1f1f" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="410" cy="308" r="3" fill="#ff1f1f"/>
</svg>