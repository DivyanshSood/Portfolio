<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sunny Himachal Travels — tour and taxi website">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind building -->
  <circle cx="256" cy="270" r="130" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Sun -->
  <circle cx="330" cy="170" r="30" fill="#ff1f1f" fill-opacity="0.9"/>
  <!-- Mountains -->
  <polygon points="110,330 210,180 310,330" fill="#ffffff" fill-opacity="0.6"/>
  <polygon points="210,180 190,210 202,214 210,200 218,216 230,208" fill="#ffffff"/>
  <polygon points="220,330 310,210 402,330" fill="#ffffff" fill-opacity="0.35"/>
  <!-- Winding road with route pins -->
  <path d="M 150 400 C 200 360 300 380 280 340 C 262 306 330 300 360 330" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g transform="translate(150 392)"><path d="M 0 -26 C -14 -26 -20 -14 -16 -6 L 0 16 L 16 -6 C 20 -14 14 -26 0 -26 Z" fill="#ff1f1f"/><circle cx="0" cy="-14" r="5" fill="#ffffff"/></g>
  <g transform="translate(360 322)"><path d="M 0 -26 C -14 -26 -20 -14 -16 -6 L 0 16 L 16 -6 C 20 -14 14 -26 0 -26 Z" fill="#ffffff" fill-opacity="0.9"/><circle cx="0" cy="-14" r="5" fill="#ff1f1f"/></g>
</svg>
