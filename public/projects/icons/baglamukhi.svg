<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Baglamukhi Travels — Kangra taxi and Devi Darshan yatra">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#ff1f1f"/>
    </linearGradient>
    <linearGradient id="stoneFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff1f1f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Red glow behind the temple -->
  <circle cx="256" cy="266" r="168" fill="url(#redGlow)" filter="url(#bigBlur)"/>

  <!-- Glass panel -->
  <g filter="url(#dropShadow)">
    <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Top edge highlight -->
  <rect x="80" y="56" width="352" height="2.5" rx="1.25" fill="url(#topHighlight)"/>

  <!-- Kangra valley ridgeline behind -->
  <g opacity="0.4">
    <polygon points="88,330 158,238 214,330" fill="#ffffff" fill-opacity="0.5"/>
    <polygon points="158,238 145,262 152,266 158,254 165,270 172,262" fill="#ffffff"/>
    <polygon points="298,330 366,244 428,330" fill="#ffffff" fill-opacity="0.42"/>
    <polygon points="366,244 354,266 361,270 366,259 372,274 379,266" fill="#ffffff"/>
  </g>

  <!-- Six temple markers — the Devi Darshan circuit -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="146" cy="150" r="5"/>
    <circle cx="190" cy="132" r="5"/>
    <circle cx="234" cy="122" r="5"/>
    <circle cx="278" cy="122" r="5"/>
    <circle cx="322" cy="132" r="5"/>
    <circle cx="366" cy="150" r="5"/>
  </g>
  <path d="M 146 150 Q 256 104 366 150" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.8" stroke-dasharray="5 7" stroke-linecap="round"/>

  <!-- Temple (shikhara) -->
  <g transform="translate(256 0)">
    <!-- Curved tower -->
    <path d="M -46 300 C -40 250 -26 214 0 182 C 26 214 40 250 46 300 Z"
          fill="url(#templeGrad)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Tier bands on the tower -->
    <path d="M -34 262 Q 0 250 34 262" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.8"/>
    <path d="M -41 282 Q 0 269 41 282" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.8"/>
    <!-- Amalaka disc -->
    <ellipse cx="0" cy="180" rx="21" ry="8" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Kalash finial -->
    <circle cx="0" cy="166" r="8" fill="#ffffff"/>
    <line x1="0" y1="158" x2="0" y2="144" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Sanctum base -->
    <rect x="-58" y="300" width="116" height="30" fill="url(#stoneFill)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <!-- Doorway -->
    <path d="M -15 330 L -15 312 Q 0 300 15 312 L 15 330 Z" fill="#0b0b0c" fill-opacity="0.6"/>
    <!-- Plinth -->
    <rect x="-70" y="330" width="140" height="16" rx="3" fill="url(#stoneFill)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <!-- Winding road up to the temple -->
  <path d="M 104 418 Q 168 396 200 372 T 256 346" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.4" stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- Cab on the road -->
  <g transform="translate(112 392)">
    <path d="M 0 18 L 6 6 L 34 6 L 42 18 L 46 18 L 46 30 L 0 30 Z" fill="url(#stoneFill)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 9 16 L 13 9 L 21 9 L 21 16 Z" fill="#0b0b0c" fill-opacity="0.5"/>
    <path d="M 25 9 L 32 9 L 38 16 L 25 16 Z" fill="#0b0b0c" fill-opacity="0.5"/>
    <rect x="43" y="20" width="4" height="4" rx="1" fill="#ff1f1f"/>
    <circle cx="12" cy="31" r="6" fill="#0b0b0c" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="12" cy="31" r="2.4" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="35" cy="31" r="6" fill="#0b0b0c" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="35" cy="31" r="2.4" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- Ground line -->
  <line x1="92" y1="346" x2="420" y2="346" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.4"/>
</svg>
